name: Notebooks

on:
  push:
  pull_request:
  schedule:
    # Run at 2 AM UTC daily, to catch drift unrelated to any push (e.g. a
    # broken download link or an upstream dependency update)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc

    - name: Install dependencies
      run: pip install -e ".[dev]"

    - name: Execute notebooks
      run: |
        shopt -s globstar
        notebooks=(docs/**/*.ipynb)
        for nb in "${notebooks[@]}"; do
          echo "Executing $nb"
          jupyter nbconvert --to notebook --execute "$nb" \
            --output "$(basename "$nb" .ipynb)_executed.ipynb" \
            --output-dir /tmp/executed_notebooks \
            --ExecutePreprocessor.timeout=1800
        done

    - name: Upload executed notebooks
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: executed-notebooks
        path: /tmp/executed_notebooks/
